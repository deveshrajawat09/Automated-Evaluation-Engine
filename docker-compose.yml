services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackeval
      POSTGRES_USER: hackeval
      POSTGRES_PASSWORD: hackeval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackeval -d hackeval"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner:
    build: ./runner
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    networks:
      - runner_net
    expose:
      - "8080"

volumes:
  postgres_data:

networks:
  runner_net:
    internal: true
